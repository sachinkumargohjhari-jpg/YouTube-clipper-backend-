<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurum Clips</title>
<style>
:root{--bg:#0A0A0A;--line:rgba(255,255,255,.1);--tx:#F3EEE0;--mut:#9A958A;--gold:#D4AF37}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(600px 300px at 50% -50px,rgba(139,92,246,.22),transparent),var(--bg);color:var(--tx);font-family:system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:980px;margin:0 auto;padding:26px 16px 60px}
h1{font-size:clamp(28px,8vw,52px);margin:10px 0;line-height:1.05}.g{background:linear-gradient(120deg,#F5E6A8,#D4AF37,#9d7d1b);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{color:var(--gold);font-weight:800;letter-spacing:.05em}.s{color:var(--mut);line-height:1.5}
input,select,button{font:inherit;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--tx);padding:13px;min-width:0}
input{width:100%}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}@media(min-width:640px){.row{grid-template-columns:repeat(4,1fr)}}
label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.cta{width:100%;margin-top:12px;border:0;font-weight:800;color:#1a1405;background:linear-gradient(120deg,#F5E6A8,#D4AF37 55%,#a98417);cursor:pointer}
.cta:disabled{opacity:.5}
#st{margin-top:18px;display:none;border:1px solid var(--line);border-radius:14px;padding:16px}
.pb{height:6px;background:var(--line);border-radius:9px;margin-top:10px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8B5CF6,#D4AF37);transition:width .5s}
#err{color:#ff7b7b;margin-top:10px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin-top:20px}
.clip{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(255,255,255,.04)}
video{width:100%;aspect-ratio:9/16;max-height:440px;background:#000;border-radius:12px}
.sc{display:inline-block;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;margin:10px 0 6px}
.dl{display:block;text-align:center;text-decoration:none;padding:13px;border-radius:12px;font-weight:800;color:#1a1405;background:linear-gradient(120deg,#F5E6A8,#D4AF37 55%,#a98417)}
</style></head><body><main>
<div class="brand">AURUM CLIPS</div>
<h1>Ek link se <span class="g">viral Shorts</span></h1>
<p class="s">YouTube video ya live stream ka link dalein. AI clips banayega aur aap MP4 download kar sakenge. Pehli baar server jagne mein ~1 minute lag sakta hai.</p>
<div id="conn" class="s" style="font-size:13px;margin-bottom:8px">Server check ho raha hai...</div>
<input id="url" placeholder="Paste YouTube Video or Live Stream Link here..." aria-label="YouTube link">
<div class="row">
<label>Quality<select id="res"><option value="2160">4K (2160p)</option><option value="1440">2K (1440p)</option><option value="1080" selected>1080p</option><option value="720">720p</option></select></label>
<label>Clip length<select id="len"><option value="0">Auto</option><option value="30">30s</option><option value="60" selected>60s</option><option value="90">90s</option></select></label>
<label>Language<select id="lang"><option value="">Auto-detect</option><option value="hi">Hindi</option><option value="en">English</option><option value="es">Spanish</option><option value="ar">Arabic</option></select></label>
<label>Captions<select id="cs"><option value="bold">Bold (Hormozi)</option><option value="karaoke">Karaoke</option><option value="minimal">Minimal</option><option value="off">Off</option></select></label>
</div>
<button class="cta" id="go" type="button" onclick="if(window.startClip){startClip()}else{alert('JavaScript load nahi hui. Purani index.html chal rahi hai ya script mein error hai.')}">Generate AI Clips</button>
<div id="st"><div id="stage">Shuru ho raha hai...</div><div class="pb"><i id="pb"></i></div></div>
<div id="err"></div>
<pre id="dbg" style="margin-top:14px;padding:10px;border:1px dashed var(--line);border-radius:10px;color:var(--mut);font-size:12px;white-space:pre-wrap;max-height:200px;overflow:auto">Debug log:
</pre>
<div class="grid" id="grid"></div>
</main>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var API='';  // same-origin
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function log(m){var t=new Date().toLocaleTimeString()+'  '+m;try{$('dbg').textContent+=t+'\n';$('dbg').scrollTop=1e9}catch(e){}console.log(t)}
function showErr(m){$('err').textContent='Error: '+m;log('ERROR: '+m)}
window.addEventListener('error',function(e){showErr('Script error: '+e.message+' (line '+e.lineno+')')});
window.addEventListener('unhandledrejection',function(e){showErr('Unhandled: '+(e.reason&&e.reason.message||e.reason))});
log('JavaScript load ho gayi. Page: '+location.href);

function api(path,opt){
  opt=opt||{};log((opt.method||'GET')+' '+path);
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},90000);opt.signal=ctl.signal;
  return fetch(API+path,opt).then(function(r){
    clearTimeout(tm);
    return r.text().then(function(t){
      log('Jawab: HTTP '+r.status+'  '+t.slice(0,200).replace(/\s+/g,' '));
      var j=null;try{j=JSON.parse(t)}catch(e){}
      if(!r.ok){var d=j&&j.detail;if(d&&typeof d!=='string')d=JSON.stringify(d);
        throw new Error('HTTP '+r.status+' - '+(d||t.slice(0,120)||'khali jawab')+(r.status==404?' | yeh route server par nahi mila, /docs mein check karein':''))}
      if(j===null)throw new Error('Server se JSON nahi aaya (galat jawab)');
      return j})
  },function(e){
    clearTimeout(tm);
    throw new Error(e&&e.name==='AbortError'?'Timeout: server ne 90 sec tak jawab nahi diya':'Network error ('+(e&&e.message)+'). Website ko Render ke link se kholein.')})
}
function fail(m){showErr(m);$('go').disabled=false;$('st').style.display='none'}
function ping(n){
  api('/api/health').then(function(){$('conn').textContent='Server connected \u2713';$('conn').style.color='#7CFF6B'})
  .catch(function(e){
    if(n<6){$('conn').textContent='Server jag raha hai, intezaar karein...';$('conn').style.color='#ffb86b';setTimeout(function(){ping(n+1)},8000)}
    else{$('conn').textContent='Server connect nahi hua';showErr(e.message)}})
}
function show(cl){
  $('grid').innerHTML=cl.map(function(c){
    return '<div class="clip"><video controls playsinline preload="metadata" src="'+esc(c.download_url)+'"></video><div class="sc">'+esc(c.viral_score)+'/100 Viral</div><div style="font-weight:700;margin-bottom:10px">'+esc(c.title)+'</div><a class="dl" href="'+esc(c.download_url)+'" download>Download MP4</a></div>'}).join('')
}
function poll(id,errs){
  api('/api/jobs/'+encodeURIComponent(id)).then(function(j){
    $('stage').textContent=j.stage;$('pb').style.width=Math.max(j.progress,3)+'%';
    if(j.status==='error')return fail('Job fail hui: '+j.error);
    if(j.status==='done'){log('Clips taiyar: '+j.clips.length);$('st').style.display='none';$('go').disabled=false;return show(j.clips)}
    setTimeout(function(){poll(id,0)},2500)
  }).catch(function(e){if(errs>=5)return fail(e.message);log('Dobara try ('+(errs+1)+'/5)');setTimeout(function(){poll(id,errs+1)},4000)})
}
window.startClip=function(){
  log('Button dabaya');
  try{
    var url=$('url').value.trim();$('err').textContent='';$('grid').innerHTML='';
    if(!/^https?:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(url)){return fail('Sahi YouTube link dalein (https://youtube.com/... ya https://youtu.be/...)')}
    $('go').disabled=true;$('st').style.display='block';$('stage').textContent='Request server ko bhej rahe hain...';$('pb').style.width='3%';
    var cs=$('cs').value;
    var body={url:url,resolution:parseInt($('res').value,10),clip_length:parseInt($('len').value,10),
      language:$('lang').value||null,caption_style:cs==='off'?'bold':cs,captions:cs!=='off'};
    log('Body: '+JSON.stringify(body));
    api('/api/process-clip',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(j){$('stage').textContent='Job shuru hui (ID: '+j.job_id.slice(0,6)+')';poll(j.job_id,0)})
    .catch(function(e){fail(e.message)})
  }catch(e){fail('Script error: '+e.message)}
};
ping(0);
})();
</script></body></html>
